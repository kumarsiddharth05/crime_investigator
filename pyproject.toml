[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crime-scene-llm-harness"
version = "0.1.0"
description = "CLI and evaluation harness for LLM-based crime scene analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Crime Scene AI Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
gemini = ["google-genai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
all = [
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "anthropic>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]

[tool.pyrefly]
search-path = ["."]
